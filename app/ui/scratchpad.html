<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scratchpad</title>
  <style>
    :root {
      --bg-dark: #090a0f;
      --bg-panel: rgba(22, 23, 38, 0.7);
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Toolbar Styling */
    .toolbar {
      background: var(--bg-panel);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      padding: 8px 12px;
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .tool-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      min-width: 32px;
    }

    .tool-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .tool-btn:active {
      transform: scale(0.96);
    }

    .tool-btn.bold {
      font-weight: 800;
    }

    .tool-btn.italic {
      font-style: italic;
    }

    /* Editor Area */
    .editor-container {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      background: transparent;
      outline: none;
    }

    .editor {
      min-height: 100%;
      outline: none;
      font-size: 15px;
      line-height: 1.6;
      color: #e5e7eb;
    }

    .editor[contenteditable="true"]:empty:before {
      content: attr(placeholder);
      color: var(--text-disabled);
      opacity: 0.5;
      cursor: text;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .status-bar {
      font-size: 11px;
      color: var(--text-muted);
      padding: 6px 12px;
      border-top: 1px solid var(--border-color);
      background: rgba(0, 0, 0, 0.2);
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <!-- Minimal Text Styling Toolbar -->
  <div class="toolbar">
    <button class="tool-btn bold" id="btn-bold" title="Bold">B</button>
    <button class="tool-btn italic" id="btn-italic" title="Italic">I</button>
    <button class="tool-btn" id="btn-bullets" title="Bullet List">&#8226; List</button>
  </div>

  <!-- Editable Document Area -->
  <div class="editor-container">
    <div class="editor" id="scratchpad-editor" contenteditable="true" placeholder="Start typing here..."></div>
  </div>

  <!-- Status Bar -->
  <div class="status-bar">
    <span id="save-status">Saved</span>
    <span id="word-count">0 words</span>
  </div>

  <script type="module" src="/src/scratchpad.ts"></script>
</body>
</html>
