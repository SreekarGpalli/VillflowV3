<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scratchpad</title>
  <style>
    :root {
      --bg: #0b0d12;
      --panel: #141924;
      --border: rgba(255,255,255,0.08);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --disabled: #64748b;
      --accent: #2dd4bf;
      --success: #4ade80;
      --danger: #fb7185;
      --font: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background:
        radial-gradient(800px 400px at 20% 0%, rgba(45,212,191,0.08), transparent 50%),
        var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: rgba(15,18,25,0.9);
      backdrop-filter: blur(12px);
      -webkit-app-region: drag;
    }
    .topbar h1 {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .toolbar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      -webkit-app-region: no-drag;
    }
    .tool-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
      min-width: 32px;
      height: 32px;
      padding: 0 8px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
    }
    .tool-btn:hover {
      background: rgba(255,255,255,0.06);
      color: var(--text);
      border-color: var(--border);
    }
    .tool-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }
    .editor-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 16px 20px 8px;
    }
    #scratchpad-editor {
      flex: 1;
      width: 100%;
      min-height: 0;
      resize: none;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--panel);
      color: var(--text);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.65;
      padding: 18px 20px;
      outline: none;
      box-shadow: 0 8px 28px rgba(0,0,0,0.25);
    }
    #scratchpad-editor:focus {
      border-color: rgba(45,212,191,0.45);
      box-shadow: 0 0 0 1px rgba(45,212,191,0.25), 0 8px 28px rgba(0,0,0,0.25);
    }
    #scratchpad-editor::placeholder { color: var(--disabled); }
    .status-bar {
      font-size: 11px;
      color: var(--muted);
      padding: 10px 20px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #save-status.status-saved { color: var(--success); }
    #save-status.status-saving { color: #fbbf24; }
    #save-status.status-unsaved { color: #f97316; }
    #save-status.status-error { color: var(--danger); }
    .dictation-pill {
      display: none;
      position: absolute;
      bottom: 48px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(20, 25, 36, 0.95);
      border: 1px solid rgba(45, 212, 191, 0.35);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45);
      pointer-events: none;
    }
    .dictation-pill.visible { display: flex; }
    .dictation-pill .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }
    .dictation-pill.recording .dot { background: #f87171; box-shadow: 0 0 8px #f87171; }
    .dictation-pill.processing .dot { background: #fbbf24; box-shadow: 0 0 8px #fbbf24; }
  </style>
</head>
<body>
  <header class="topbar">
    <h1>Scratchpad</h1>
    <div class="toolbar" role="toolbar" aria-label="Formatting">
      <button class="tool-btn" type="button" id="btn-bold" title="Bold (Markdown)">B</button>
      <button class="tool-btn" type="button" id="btn-italic" title="Italic (Markdown)"><i>I</i></button>
      <button class="tool-btn" type="button" id="btn-bullets" title="Bullet line">• List</button>
      <button class="tool-btn" type="button" id="btn-numbers" title="Numbered line">1. List</button>
      <button class="tool-btn" type="button" id="btn-undo" title="Undo">Undo</button>
      <button class="tool-btn" type="button" id="btn-clear" title="Clear all">Clear</button>
    </div>
  </header>

  <div class="dictation-pill" id="dictation-pill" aria-live="polite">
    <span class="dot"></span>
    <span class="label" id="dictation-pill-label">Recording</span>
  </div>

  <div class="editor-wrap">
    <textarea
      id="scratchpad-editor"
      placeholder="Dictate or type here. Markdown-style formatting helpers are on the toolbar."
      spellcheck="true"
      aria-label="Scratchpad notes"
    ></textarea>
  </div>

  <footer class="status-bar">
    <span id="save-status" class="status-saved">Saved</span>
    <span id="word-count">0 words</span>
  </footer>

  <script type="module" src="/src/scratchpad.ts"></script>
</body>
</html>
