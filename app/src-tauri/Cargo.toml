[package]
name = "villflow"
version = "0.2.1"
edition = "2021"
description = "Windows push-to-talk voice dictation"
license = "MIT"
authors = ["VillFlow contributors"]

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
vf-core = { path = "../../crates/vf-core" }
vf-store = { path = "../../crates/vf-store" }
vf-cloud = { path = "../../crates/vf-cloud" }
vf-engine = { path = "../../crates/vf-engine" }
winreg = "0.52"
tauri-plugin-notification = "2"
env_logger = "0.11"
log = "0.4"
dirs = "5"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Production builds serve embedded UI from frontendDist.
# `tauri dev` disables this via --no-default-features and uses devUrl instead.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
